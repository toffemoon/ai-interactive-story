<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>后台控制台</title>
<style>*{box-sizing:border-box}body{font:14px/1.55 -apple-system,system-ui,sans-serif;margin:0;color:#1f2328;background:#fff}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0}
header input{padding:6px 8px;border:1px solid #ccc;border-radius:6px;font:inherit}
button{padding:6px 12px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font:inherit}
button.sec{background:#6b7280}#st{font-size:12px;color:#888}#who{font-size:12px;color:#555}
#clk{font-size:12px;color:#0a7;margin-left:auto}
.tab{background:#eef1f5;color:#333}.tab.on{background:#2563eb;color:#fff}
#accwrap,#ocwrap{display:none;height:calc(100vh - 53px)}
#distwrap{display:none;height:calc(100vh - 53px);overflow:auto}
#acclist,#oclist{width:250px;border-right:1px solid #e5e7eb;overflow:auto;flex:0 0 auto}
#accmain{flex:1;display:flex;flex-direction:column;min-width:0}
#accpanel{flex:1;overflow:auto;padding:16px 20px}
#accpanel h3{margin:0 0 12px;font-size:16px}#accpanel h4{margin:18px 0 8px;font-size:14px;color:#555}
.distbox{background:#f7f8fa;border:1px solid #eee;border-radius:8px;padding:10px 12px;margin-bottom:6px}
.drow{margin:7px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drow select{padding:5px 8px;border:1px solid #ccc;border-radius:6px;font:inherit;max-width:340px}
.sess{padding:9px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.sess:hover{background:#f6f7f9}.sess.on{background:#e8f0fe}
.sess .id{font-weight:600}.sess .meta{color:#999;font-size:12px}
#dirpanel{flex:1;display:none;flex-direction:column;min-width:0}
#dirhdr{padding:8px 14px;border-bottom:1px solid #eee;color:#555;font-size:13px;display:flex;gap:10px;align-items:center}
#conv{flex:1;overflow:auto;padding:14px;background:#fafafa;position:relative}
.b{max-width:80%;margin:6px 0;padding:8px 11px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.b.player{background:#2563eb;color:#fff;margin-left:auto}.b.char{background:#fff;border:1px solid #e5e7eb}
.narr{color:#666;font-style:italic;margin:8px 4px;font-size:13px}
.oplabel{font-size:11px;color:#7c3aed;background:#f3effe;border-radius:4px;padding:2px 7px;margin:7px 0;display:inline-block}
#box{border-top:1px solid #e5e7eb;padding:10px 14px}
#box textarea{width:100%;min-height:52px;padding:8px;border:1px solid #ccc;border-radius:6px;font:inherit}
#box select,#box #target,#box #playmsg{padding:5px 7px;border:1px solid #ccc;border-radius:6px;font:inherit}
#box .boxrow{display:flex;gap:8px;margin-bottom:6px}#box #playmsg{flex:1}
#box .boxhint{font-size:12px;color:#999;margin:2px 0 5px}#queue{font-size:12px;color:#a15;margin-bottom:4px}
#ocdetail{flex:1;overflow:auto;padding:16px 26px;min-width:0}
#ocdetail h3{margin:20px 0 8px;font-size:15px;color:#b1442f;border-bottom:2px solid #f0c9bf;padding-bottom:4px}
#ocdetail h4{margin:14px 0 5px;font-size:14px}#ocdetail h5{margin:11px 0 4px;font-size:13px;color:#555}
#ocdetail p{margin:5px 0}#ocdetail ul{margin:5px 0;padding-left:20px}#ocdetail li{margin:2px 0}
#ocdetail blockquote{margin:8px 0;padding:6px 10px;background:#f7f8fa;border-left:3px solid #cbd2d9;color:#555;font-size:13px}
.trow{display:flex;gap:10px;padding:3px 0;border-bottom:1px solid #f3f3f3}.trow span:first-child{min-width:96px;color:#666;font-weight:600}
.ocimg{max-width:360px;width:100%;border-radius:10px;border:1px solid #eee;display:block;margin:4px 0 16px}
.ocsec{max-width:780px}.octest{background:#16a34a;margin:2px 0 12px}</style>
</head><body>
<header><h1>后台控制台</h1>
<span id="tabs" style="display:none">
 <button id="tabAcc" class="tab" onclick="showView('acc')">👥 账户</button>
 <button id="tabOC" class="tab" onclick="showView('oc')">🍎 OC集</button>
 <button id="tabDist" class="tab" onclick="showView('dist')">📦 分发卡/预设</button>
</span>
<span id="loginbar"><input id="liEmail" placeholder="邮箱/用户名" size="15"><input id="liPass" type="password" placeholder="密码" size="11"><button onclick="doLogin()">登录</button></span>
<input id="tok" type="password" placeholder="OPERATOR_TOKEN(可空)" size="16">
<span id="who"></span>
<button id="logoutBtn" class="sec" style="display:none" onclick="doLogout()">退出</button>
<span id="clk"></span><span id="st"></span></header>

<div id="accwrap">
 <div id="acclist"></div>
 <div id="accmain">
  <div id="accpanel"><div class="meta" style="padding:16px;color:#999">← 左边点一个账户</div></div>
  <div id="dirpanel">
   <div id="dirhdr"><button class="sec" onclick="backToAccount()">← 返回账户</button><span id="shdr"></span></div>
   <div id="conv"></div>
   <div id="box">
    <div class="boxrow"><input id="playmsg" type="text" placeholder="🎮 以玩家身份发一句、推进一回合…回车" onkeydown="if(event.key==='Enter')playSay()"><button onclick="playSay()">▶ 玩家发送</button></div>
    <div class="boxhint">↑ 玩家行动(你来对话)　|　↓ 🎬 导演(幕后影响这局)</div>
    <div id="queue"></div>
    <textarea id="msg" placeholder="导演=写指令(让X警觉…) / 直接台词=写那句话 / 旁白=写环境描写"></textarea>
    <div style="margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
     <select id="mode" onchange="onMode()"><option value="director">🎬 导演(AI 织进剧情)</option><option value="direct">🎤 直接台词(角色逐字说)</option><option value="narration">🌧 旁白(逐字写进剧情)</option></select>
     <input id="target" type="text" placeholder="角色名" style="display:none;width:110px">
     <label id="stickyL" style="font-size:13px"><input id="sticky" type="checkbox"> 持续</label>
     <button id="bNext" onclick="send('next')">发送(下回合)</button>
     <button id="bNow" onclick="send('now')">⚡ 立即</button>
     <button class="sec" onclick="clearQ()">清空队列</button>
    </div>
   </div>
  </div>
 </div>
</div>

<div id="ocwrap"><div id="oclist"></div><div id="ocdetail"></div></div>

<div id="distwrap">
 <div class="ocsec" style="padding:20px 26px;max-width:680px">
  <h3 style="color:#b1442f">📦 分发卡 / 预设给用户</h3>
  <p style="color:#666">把官方/公共的卡或预设指派给某用户(成为他私有)。存档/OC 分发在「👥 账户」里做。</p>
  <div class="drow">用户 <select id="distUser"></select> <button class="sec" onclick="loadUsers()">↻ 刷新</button></div>
  <div class="drow">类型 <select id="distType" onchange="distType()"><option value="card">卡</option><option value="preset">预设</option></select></div>
  <div class="drow" id="distCardKindRow">卡种 <select id="distCardKind"><option>characters</option><option>worlds</option><option>stories</option><option>players</option></select></div>
  <div class="drow">名称 <input id="distName" placeholder="卡 slug" style="min-width:240px"></div>
  <div class="drow"><button onclick="doAssign(false)">分发给该用户</button><button class="sec" onclick="doAssign(true)">设回官方</button></div>
  <div id="distMsg" style="margin-top:6px"></div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
$("tok").value=localStorage.op_tok||""; $("tok").oninput=()=>{localStorage.op_tok=$("tok").value;boot();};
let ROLE="",curUser=null,curUserObj=null,cur=null,accounts=[],ocs=[],ocLoaded=false;
const H=()=>{const h={"Content-Type":"application/json"};if($("tok").value)h["X-Operator-Token"]=$("tok").value;const t=localStorage.ais_auth_token;if(t)h["Authorization"]="Bearer "+t;return h;};
const st=t=>$("st").textContent=t;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function bub(role,name,text){const d=el("div","b "+role);if(name)d.appendChild(el("b",null,name+": "));d.appendChild(document.createTextNode(text));return d;}
async function j(url,opt){const r=await fetch(url,opt||{headers:H()});if(!r.ok){st("✗ "+r.status+(r.status==401?" 未登录/失效":r.status==403?" 权限不足":r.status==503?" 未启用":""));throw r;}st("");return r.json();}
function sgt(x){if(!x)return"";try{return new Date(String(x).replace(" ","T")).toLocaleString("zh-CN",{timeZone:"Asia/Singapore",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});}catch(e){return String(x).slice(0,16);}}

async function doLogin(){const id=$("liEmail").value.trim(),pw=$("liPass").value;if(!id||!pw){st("填邮箱+密码");return;}try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identifier:id,password:pw})});const d=await r.json();if(!r.ok){st("✗ "+(d.detail||"登录失败"));return;}localStorage.ais_auth_token=d.token;$("liPass").value="";st("已登录 ✓");boot();}catch(e){st("登录出错");}}
async function doLogout(){try{await fetch("/api/auth/logout",{method:"POST",headers:H()});}catch(e){}localStorage.removeItem("ais_auth_token");curUser=null;cur=null;boot();}

function showView(v){$("accwrap").style.display=v==="acc"?"flex":"none";$("ocwrap").style.display=v==="oc"?"flex":"none";$("distwrap").style.display=v==="dist"?"block":"none";$("tabAcc").classList.toggle("on",v==="acc");$("tabOC").classList.toggle("on",v==="oc");$("tabDist").classList.toggle("on",v==="dist");if(v==="acc")loadAccounts();if(v==="oc"&&!ocLoaded){ocLoaded=true;loadOC();}if(v==="dist")loadUsers();}

// ── 账户中心 ──
async function loadAccounts(){try{const d=await j("/api/operator/users");accounts=d.users||[];const L=$("acclist");L.innerHTML="";accounts.forEach(u=>{const it=el("div","sess"+(u.id===curUser?" on":""));it.appendChild(el("div","id",u.email||u.username||u.id));it.appendChild(el("div","meta",u.role+" · "+(u.sessions||0)+"局"));it.onclick=()=>selectAccount(u);L.appendChild(it);});if(!accounts.length)L.appendChild(el("div","meta","(还没有用户)"));}catch(e){}}
function selectAccount(u){curUser=u.id;curUserObj=u;cur=null;document.querySelectorAll("#acclist .sess").forEach((n,k)=>n.classList.toggle("on",(accounts[k]||{}).id===u.id));$("dirpanel").style.display="none";$("accpanel").style.display="block";renderAccount();loadAccountSessions();loadDistOptions();}
function renderAccount(){const u=curUserObj,P=$("accpanel");P.innerHTML="";P.appendChild(el("h3",null,"👤 "+(u.email||u.username)+"  ·  "+u.role+"  ·  "+(u.sessions||0)+"局"));
 const roleBox=el("div","distbox");let rh='角色:<b>'+u.role+'</b>';
 if(u.role==="superadmin")rh+=' <span style="color:#888">(superadmin 由 .env 钉死,不可改)</span>';
 else rh+=' <button onclick="setRole(\'admin\')">设为 admin</button> <button class="sec" onclick="setRole(\'user\')">设为 user</button>';
 roleBox.innerHTML='<div class="drow">'+rh+'</div>';P.appendChild(roleBox);
 const dist=el("div","distbox");dist.innerHTML='<div class="drow">分发 OC <select id="accOc"></select> <button onclick="doAssignOC()">▶ 开局分发给他</button></div><div class="drow">分发老存档 <select id="accOld"></select> <button onclick="doAssignOld()">分给他</button></div>';P.appendChild(dist);
 P.appendChild(el("h4",null,"他的对话(点一条进导演)"));const sl=el("div");sl.id="accsess";P.appendChild(sl);}
async function setRole(role){if(!curUser)return;try{await j("/api/admin/set_role",{method:"POST",headers:H(),body:JSON.stringify({user:curUser,role})});st("✓ 已设为 "+role);const keep=curUser;await loadAccounts();const u=accounts.find(x=>x.id===keep);if(u)selectAccount(u);}catch(e){}}
async function loadAccountSessions(){if(!curUser)return;try{const d=await j("/api/operator/account_sessions/"+encodeURIComponent(curUser));const L=$("accsess");if(!L)return;L.innerHTML="";(d.sessions||[]).forEach(s=>{const it=el("div","sess");it.appendChild(el("div","id",(s.story||"(未命名)")+(s.player?" · 玩"+s.player:"")));it.appendChild(el("div","meta",(s.turns||0)+"轮 · "+sgt(s.updated_at)+(s.last_input?" · 最后:"+s.last_input:"")));it.onclick=()=>selectSession(s.id);L.appendChild(it);});if(!(d.sessions||[]).length)L.appendChild(el("div","meta","(还没有对话)"));}catch(e){}}
async function loadDistOptions(){try{const oc=await j("/api/operator/oc");const so=$("accOc");if(so){so.innerHTML="";(oc.ocs||[]).forEach((o,i)=>{if(o.card){const op=el("option",null,o.character||("OC"+i));op.value=i;so.appendChild(op);}});if(!so.options.length)so.appendChild(el("option",null,"(没有可分发OC)"));}}catch(e){}
 try{const un=await j("/api/operator/unowned_sessions");const su=$("accOld");if(su){su.innerHTML="";(un.sessions||[]).forEach(s=>{const op=el("option",null,(s.story||s.id.slice(0,8))+" · "+(s.turns||0)+"轮");op.value=s.id;su.appendChild(op);});if(!(un.sessions||[]).length)su.appendChild(el("option",null,"(没有无主存档)"));}}catch(e){}}
async function doAssignOC(){const sel=$("accOc");const i=sel&&sel.value;if(i===""||i==null){st("没有可分发的OC");return;}try{st("开局中…AI 生成开场");await j("/api/operator/assign_oc",{method:"POST",headers:H(),body:JSON.stringify({index:Number(i),user:curUser})});st("✓ OC 已分发,该用户「我的存档」即可玩");loadAccountSessions();loadAccounts();}catch(e){}}
async function doAssignOld(){const sel=$("accOld");const sid=sel&&sel.value;if(!sid){st("没有可分发的老存档");return;}try{const d=await j("/api/operator/assign_session",{method:"POST",headers:H(),body:JSON.stringify({session_id:sid,user:curUser})});st(d.assigned?"✓ 老存档已分发":"未匹配");loadAccountSessions();loadDistOptions();loadAccounts();}catch(e){}}

// ── 导演(账户里某条对话)──
function selectSession(sid){cur=sid;$("accpanel").style.display="none";$("dirpanel").style.display="flex";loadSession();}
function backToAccount(){cur=null;$("dirpanel").style.display="none";$("accpanel").style.display="block";loadAccountSessions();}
async function loadSession(silent){if(!cur)return;try{const d=await j("/api/operator/session/"+encodeURIComponent(cur));const C=$("conv");const atBottom=C.scrollHeight-C.scrollTop-C.clientHeight<60;C.innerHTML="";(d.turns||[]).forEach(t=>{(t.operator_applied||[]).forEach(a=>{const tag=a.mode==="direct"?("🎤 台词"+(a.target?"("+a.target+")":"")):(a.mode==="narration"?"🌧 旁白":"🎬 导演");C.appendChild(el("div","oplabel",tag+":"+(a.content||"")));});if(t.player_input)C.appendChild(bub("player","",t.player_input));if(t.narration)C.appendChild(el("div","narr",t.narration));(t.messages||[]).forEach(m=>C.appendChild(bub("char",m.name||m.character_id||"",m.text||"")));});const s=d.state||{},sc=s.scene||{};$("shdr").textContent=cur.slice(0,12)+"  地点:"+(sc.location||"?")+"  在场:"+((sc.present_characters||[]).join("、")||"?")+"  第"+(s.turn_count||0)+"回合";const q=d.operator_inject||[];$("queue").textContent=q.length?("待注入 "+q.length+":"+q.map(x=>(typeof x=="object"?x.content+(x.sticky?"[持续]":"[一次]"):x)).join(" / ")):"";if(!silent||atBottom)C.scrollTop=C.scrollHeight;}catch(e){}}
function onMode(){const m=$("mode").value;$("target").style.display=m==="direct"?"":"none";$("stickyL").style.display=m==="director"?"":"none";$("bNext").style.display=m==="director"?"":"none";$("bNow").textContent=m==="director"?"⚡ 立即":"发送";}
async function send(timing){if(!cur){st("先选一条对话");return;}const m=$("msg").value.trim();if(!m)return;const mode=$("mode").value;const now=(timing==="now"&&mode==="director");if(mode==="direct"&&!$("target").value.trim())st("直接台词要填角色名(留空=旁白)");try{st(now?"AI 生成中…":(mode!=="director"?"插入中…":""));await j("/api/operator/inject",{method:"POST",headers:H(),body:JSON.stringify({session_id:cur,content:m,mode,target:$("target").value.trim(),sticky:$("sticky").checked,now})});$("msg").value="";st("已发送 ✓");loadSession();}catch(e){}}
async function clearQ(){if(!cur)return;try{await j("/api/operator/inject/"+encodeURIComponent(cur),{method:"DELETE",headers:H()});st("已清空 ✓");loadSession();}catch(e){}}
async function playSay(){if(!cur){st("先选一条对话");return;}const m=$("playmsg").value.trim();if(!m)return;try{st("🎮 玩家发送…AI 生成中");await j("/api/operator/say",{method:"POST",headers:H(),body:JSON.stringify({session_id:cur,user:m})});$("playmsg").value="";st("已发送 ✓");loadSession();}catch(e){}}

// ── OC集(查看 + super 开测)──
function mdToHtml(t){t=(t||"").replace(/^---\n[\s\S]*?\n---\n/,"").replace(/!\[\[.*?\]\]/g,"").replace(/\[\[(?:[^\]|]*\|)?([^\]]+)\]\]/g,"$1");const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");let h="",ul=false;const cu=()=>{if(ul){h+="</ul>";ul=false;}};for(const line of t.split("\n")){if(!line.trim()){cu();continue;}let m;if(m=line.match(/^(#{1,6})\s+(.*)$/)){cu();const lv=Math.min(m[1].length+1,6);h+="<h"+lv+">"+inl(m[2])+"</h"+lv+">";}else if(m=line.match(/^\s*>\s?(.*)$/)){cu();h+="<blockquote>"+inl(m[1])+"</blockquote>";}else if(m=line.match(/^\s*[-*]\s+(.*)$/)){if(!ul){h+="<ul>";ul=true;}h+="<li>"+inl(m[1])+"</li>";}else{cu();h+="<p>"+inl(line)+"</p>";}}cu();return h;}
async function loadOC(){try{const d=await j("/api/operator/oc");ocs=d.ocs||[];const L=$("oclist");L.innerHTML="";ocs.forEach((o,i)=>{const it=el("div","sess");it.appendChild(el("div","id","🍎 "+(o.character||"OC")));it.appendChild(el("div","meta","用户:"+(o.user||"?")));it.onclick=()=>showOC(i);L.appendChild(it);});if(ocs.length)showOC(0);else $("ocdetail").innerHTML="<p style=color:#999>(oc/index.json 里没有 OC)</p>";}catch(e){}}
function showOC(i){const o=ocs[i];if(!o)return;document.querySelectorAll("#oclist .sess").forEach((n,k)=>n.classList.toggle("on",k===i));const canTest=(ROLE==="superadmin"||(!ROLE&&!!$("tok").value));let h="<div class=ocsec><h3>🍎 "+o.character+"　·　用户 "+o.user+"</h3>"+(o.card&&canTest?"<button class=octest onclick='startOCTest("+i+")'>▶ 用「"+o.character+"」开测对话(super)</button>":(o.card?"":"<p style=color:#999>(没有引擎角色卡,不能开测)</p>"));if(o.art)h+="<img class=ocimg src='"+o.art+"' alt=立绘>";h+=mdToHtml(o.profile)+"</div><div class=ocsec><h3>🗺 世界观</h3>";if(o.map)h+="<img class=ocimg src='"+o.map+"' alt=地图>";h+=mdToHtml(o.world)+"</div>";$("ocdetail").innerHTML=h;$("ocdetail").scrollTop=0;}
async function startOCTest(i){st("开局中…AI 生成开场");try{const d=await j("/api/operator/oc/start",{method:"POST",headers:H(),body:JSON.stringify({index:i})});cur=d.session_id;showView("acc");$("accpanel").style.display="none";$("dirpanel").style.display="flex";loadSession();st("已用「"+(d.character||"")+"」开测(临时局,无归属)");}catch(e){}}

// ── 分发卡/预设(admin)──
async function loadUsers(){try{const d=await j("/api/operator/users");const S=$("distUser");S.innerHTML="";(d.users||[]).forEach(u=>{const o=el("option",null,(u.email||u.username||u.id)+"  ·  "+u.role);o.value=u.id;S.appendChild(o);});if(!(d.users||[]).length)S.appendChild(el("option",null,"(还没有用户)"));}catch(e){}}
function distType(){const t=$("distType").value;$("distCardKindRow").style.display=t==="card"?"flex":"none";$("distName").placeholder=t==="card"?"卡 slug":"预设 slug";}
async function doAssign(official){const uid=official?"":$("distUser").value;const t=$("distType").value;const name=$("distName").value.trim();const M=$("distMsg");if(!name){M.style.color="#a15";M.textContent="先填名称";return;}let url,body;if(t==="card"){url="/api/operator/assign_card";body={kind:$("distCardKind").value,name,user:uid};}else{url="/api/operator/assign_preset";body={name,user:uid};}try{const d=await j(url,{method:"POST",headers:H(),body:JSON.stringify(body)});M.style.color=d.assigned?"#0a7":"#a15";M.textContent=d.assigned?("✓ 已"+(official?"设回官方":"分发给该用户")):"未匹配(只能分发官方/公共行,或名称不对)";}catch(e){M.style.color="#a15";M.textContent="失败(权限或网络)";}}

// ── 角色感知启动 ──
async function boot(){
 ROLE="";let loggedIn=false;
 try{const r=await fetch("/api/auth/me",{headers:H()});const d=r.ok?await r.json():{};const u=d&&d.user;
  if(u){ROLE=u.role||"user";loggedIn=true;$("who").textContent="👤 "+(u.email||u.username)+" · "+ROLE;}
  else if($("tok").value){ROLE="";loggedIn=true;$("who").textContent="🔑 OPERATOR 后门 · super";}
  else{$("who").textContent="";}
 }catch(e){$("who").textContent="";}
 const isSuper=ROLE==="superadmin"||(!ROLE&&!!$("tok").value);
 const isAdmin=ROLE==="admin";
 $("loginbar").style.display=loggedIn?"none":"";
 $("logoutBtn").style.display=(loggedIn&&ROLE)?"":"none";
 $("tabs").style.display=loggedIn?"":"none";
 $("tabAcc").style.display=isSuper?"":"none";
 $("tabOC").style.display=(isSuper||isAdmin)?"":"none";
 $("tabDist").style.display=(isSuper||isAdmin)?"":"none";
 if(!loggedIn){$("accwrap").style.display="none";$("ocwrap").style.display="none";$("distwrap").style.display="none";return;}
 if(isSuper)showView("acc");
 else if(isAdmin)showView("oc");
 else $("who").textContent+="(无后台权限)";
}
function tickClk(){var c=$("clk");if(c)c.textContent="🇸🇬 "+new Date().toLocaleString("zh-CN",{timeZone:"Asia/Singapore",hour12:false});}
tickClk();setInterval(tickClk,1000);
onMode();
boot();
setInterval(()=>{if(cur&&$("dirpanel").style.display!=="none")loadSession(true);},4000);
</script></body></html>
