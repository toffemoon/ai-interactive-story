# Render Blueprint —— 后端(FastAPI 引擎,同时托管前端静态)。
# 部署:Render 控制台 → New → Blueprint → 连 github.com/toffemoon/ai-interactive-story
# 标了 sync:false 的两个密钥(LLM_API_KEY / DATABASE_URL)Render 会提示你填。
# DATABASE_URL 用 Supabase 的 **Session pooler** 连接串(Settings→Database→Connection pooling,
# 端口 5432),不要用直连 db.<ref>.supabase.co(只有 IPv6,Render 连不上)。
#
# ⚠️ 本配置开【完整 deep 模式】(向量召回 + Phase 3 在场过滤,含悟空案修复):
#   - buildCommand 用 requirements.txt(含 torch/sentence-transformers,镜像较大、构建较慢)。
#   - plan 至少 standard:starter(512MB)装不下 torch+bge(峰值 ~1GB)会 OOM。
#   - 首次触发 deep 时后台下载 bge-small-zh(~130MB)到容器,加载完召回生效(首轮稍慢)。
#   - 只想要轻量 standard 模式(无向量召回):buildCommand 换回 requirements-deploy.txt、plan 可用 starter。
services:
  - type: web
    name: ai-interactive-story
    runtime: python
    plan: standard           # torch+bge 需内存(峰值 ~1GB);starter 会 OOM。付费档,无休眠。
    # 先装 CPU 版 torch(~200MB),避免 sentence-transformers 默认拉 CUDA 版(~2GB+)撑爆构建。
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: LLM_API_KEY
        sync: false            # 你的 DeepSeek key,Render 控制台填
      - key: DATABASE_URL
        sync: false            # Supabase session pooler 连接串,Render 控制台填
      # ── 账户系统(账户系统路线图 Phase 1)──
      # 稳定配置写死在这;3 个"激活项"标 sync:false → Render 控制台填(其余自动)。
      # ⚠️ 顺序:先在控制台填 AUTH_TOKEN_PEPPER + SMTP_PASS,再把 AUTH_ENABLED 设 1。
      #   (AUTH_ENABLED=1 但 SMTP 未配 → 发码端点 503 fail-closed,注册发不出码。)
      - key: SUPERADMIN_EMAIL
        value: gengyue081@gmail.com   # 这个邮箱的账号永远是 superadmin(只一个)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: gengyue081@gmail.com
      - key: SMTP_FROM
        value: gengyue081@gmail.com
      - key: AUTH_ENABLED
        sync: false            # 控制台设 "1" 开启账户系统(先填好下面两个密钥再开)
      - key: AUTH_TOKEN_PEPPER
        sync: false            # 随机长串(用之前生成的那个),控制台填;改了会让已发 token/验证码失效
      - key: SMTP_PASS
        sync: false            # Gmail 应用专用密码,控制台填
