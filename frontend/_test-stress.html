<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="muyan.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="views/ReconRail.jsx"></script>
<script type="text/babel" src="views/ReconStoryDetail.jsx"></script>
<script type="text/babel" src="views/ReconChat.jsx"></script>
<script type="text/babel">
const Q = new URLSearchParams(location.search).get("p") || "story";
const chars = Array.from({length:15},(_,i)=>({data:{name:"角色"+String(i+1).padStart(2,"0"),persona:"这是第 "+(i+1)+" 位角色的较长人设描述，用来测试列表在真实数据量下的表现是否会溢出画布。"}}));
const preset = {name:"高考后我助丞相北伐",data:{name:"高考后我助丞相北伐",synopsis:"高考结束的那个夜晚，你醒来时发现自己躺在五丈原的军帐里。丞相的灯还亮着，北伐的粮道断了三天——而你书包里，还有一本《高中历史》。",tags:["历史","穿越","群像"],author:"店内收录",world:{entries:[{name:"五丈原",text:"蜀军最后一次北伐的驻地，粮道是命脉。"},{name:"时间锚",text:"你只能在子时往返两个时代，每次携带不超过书包容量。"},{name:"军中规矩",text:"丞相治军极严，无令不得入中军帐。"},{name:"史书悖论",text:"你知道结局，但说出口的预言都会以另一种方式应验。"},{name:"额外条目五",text:"用于测试截断。"},{name:"额外条目六",text:"不应显示。"}]},characters:chars,playables:chars.slice(0,6).map(c=>({name:c.data.name,persona:c.data.persona})),story:{title:"高考后我助丞相北伐",premise:"……"}}};
const chatChars = Array.from({length:38},(_,i)=>({name:"角色"+(i+1),persona:"第 "+(i+1)+" 位可聊角色"}));
const msgs = Array.from({length:12},(_,i)=>(i%2? {who:"me",text:"这是我发出的第 "+i+" 条比较长的消息，看看滚动区是否正常工作而不是被裁剪。"} : {who:"角色1",text:"这是角色回复的第 "+i+" 条消息。雨还在下，站台的灯忽明忽暗，我们继续聊下去看看溢出表现。"}));
const el = Q==="story" ? React.createElement(window.ReconStoryDetail,{preset}) : React.createElement(window.ReconChat,{characters:chatChars,activeName:"角色1",messages:msgs,value:""});
ReactDOM.createRoot(document.getElementById("root")).render(el);
</script></body></html>
