<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 互动故事</title>
  <link rel="stylesheet" href="styles.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 首屏 loading:纯 HTML/CSS,页面一打开就在,治零构建下 babel 现编译 app.jsx 的 1-2s 白屏。
       React 挂载后由 app.jsx 把 #boot 淡出移除。样式内联在此,不依赖 styles.css 的加载时机。 -->
  <style>
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px;
      color: #20201d;
      font-family: "Aptos", "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        linear-gradient(90deg, rgba(32,32,29,.035) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(rgba(32,32,29,.03) 1px, transparent 1px) 0 0 / 28px 28px,
        #f3f1ec;
      transition: opacity .42s ease;
    }
    #boot.boot-hide { opacity: 0; pointer-events: none; }
    #boot .boot-title {
      font-size: 24px; letter-spacing: .04em;
      animation: bootBreathe 1.9s ease-in-out infinite;
    }
    #boot .boot-bar {
      position: relative; width: 220px; height: 3px;
      border-radius: 3px; overflow: hidden;
      background: rgba(32,32,29,.12);
    }
    #boot .boot-bar span {
      position: absolute; top: 0; bottom: 0; width: 28%;
      border-radius: 3px; background: #315d4f;
      animation: bootSlide 1.15s ease-in-out infinite;
    }
    #boot .boot-slogan { font-size: 13px; color: #6f706b; }
    @keyframes bootSlide { 0% { left: -30%; } 100% { left: 100%; } }
    @keyframes bootBreathe { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #boot .boot-title, #boot .boot-bar span { animation-duration: 0s; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- 首屏 loading 节点(占位文案,最终由 yufei 定) -->
  <div id="boot">
    <div class="boot-title">AI 互动故事</div>
    <div class="boot-bar"><span></span></div>
    <div class="boot-slogan">正在翻开你的故事……</div>
  </div>
  <!-- 缓存击穿:零构建下浏览器会缓存 app.jsx,改了不刷新就看不到。改前端时 bump 这个 ?v= 值,普通刷新即可生效。 -->
  <script type="text/babel" src="app.jsx?v=20260609d" data-type="module"></script>
</body>
</html>
