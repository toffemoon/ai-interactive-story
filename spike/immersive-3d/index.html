<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>沉浸式 3D 去险原型 · 热/性能 soak</title>
<style>
  html,body{margin:0;height:100%;background:#11131a;overflow:hidden;font:13px/1.5 -apple-system,system-ui,"Microsoft YaHei",sans-serif}
  #c{display:block;width:100vw;height:100vh;touch-action:none}
  #hud{position:fixed;top:8px;left:8px;z-index:10;color:#cfe;background:rgba(0,0,0,.55);
       padding:8px 11px;border-radius:8px;font-variant-numeric:tabular-nums;white-space:pre;pointer-events:none}
  #hud b{color:#7fd4a8}
  #fpsbig{position:fixed;top:8px;right:10px;z-index:10;font-size:34px;font-weight:700;color:#7fd4a8;
          background:rgba(0,0,0,.45);padding:2px 12px;border-radius:8px;font-variant-numeric:tabular-nums}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#f88;
       background:#11131a;text-align:center;padding:24px;z-index:20;font-size:15px}
  #note{position:fixed;bottom:8px;left:8px;right:8px;z-index:10;color:#89a;background:rgba(0,0,0,.45);
        padding:6px 10px;border-radius:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">启动中…</div>
<div id="fpsbig">–</div>
<div id="note">去险原型:在真·中低端安卓 + 微信内置浏览器里连续看 5–10 分钟。盯 fps 是否稳 30、机身是否烫、是否掉帧崩。绿=好。</div>
<div id="err">这台设备/浏览器没有可用的 WebGL —— 沉浸式 3D 在此不可用(需走 2.5D/预渲染降级)。</div>

<script type="module">
import * as THREE from "./three.module.min.js";

const canvas = document.getElementById("c");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
} catch (e) {
  document.getElementById("err").style.display = "flex"; throw e;
}
if (!renderer || !renderer.getContext()) { document.getElementById("err").style.display = "flex"; throw new Error("no webgl"); }

const DPR = Math.min(window.devicePixelRatio || 1, 1.5);   // 关键:钳制 pixelRatio
renderer.setPixelRatio(DPR);
function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); cam.aspect = window.innerWidth / window.innerHeight; cam.updateProjectionMatrix(); }
window.addEventListener("resize", resize);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171a22);
const cam = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);

// ── 程序化 blockout 房间(无灯光 = MeshBasic 模拟"烘焙",运行时零光照成本)──
function box(w, h, d, color) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color })); }
const room = new THREE.Group(); scene.add(room);
const floor = box(16, 0.2, 16, 0x2a2f3a); floor.position.y = -0.1; room.add(floor);
const wallA = box(16, 6, 0.3, 0x222732); wallA.position.set(0, 3, -8); room.add(wallA);
const wallB = box(0.3, 6, 16, 0x242935); wallB.position.set(-8, 3, 0); room.add(wallB);
const wallC = box(0.3, 6, 16, 0x202530); wallC.position.set(8, 3, 0); room.add(wallC);
const counter = box(4, 1.1, 1.2, 0x3a2f28); counter.position.set(0, 0.55, -5); room.add(counter);     // 收银台
const desk = box(2.2, 0.9, 1.2, 0x33312a); desk.position.set(5, 0.45, 2); room.add(desk);              // 创作桌

// ── 书架的"书":InstancedMesh,~600 本 = 1 个 draw call(测实例化/draw-call 纪律)──
const BOOKS = 600;
const bookGeo = new THREE.BoxGeometry(0.16, 0.55, 0.42);
const books = new THREE.InstancedMesh(bookGeo, new THREE.MeshBasicMaterial(), BOOKS);
const m = new THREE.Matrix4(); const col = new THREE.Color(); let bi = 0;
for (const wall of [{ x: -7.6, rot: 0 }, { x: 7.6, rot: 0 }]) {
  for (let shelf = 0; shelf < 6; shelf++) {
    for (let n = 0; n < 50 && bi < BOOKS; n++) {
      const z = -7 + n * 0.28;
      m.makeTranslation(wall.x, 0.6 + shelf * 0.9, z);
      books.setMatrixAt(bi, m);
      books.setColorAt(bi, col.setHSL((bi % 12) / 12, 0.35, 0.45));
      bi++;
    }
  }
}
books.count = bi; books.instanceMatrix.needsUpdate = true;
scene.add(books);

// ── OC 立绘 billboard(真实 art.jpg,相机朝向 quad —— 即"纸板转向你")──
let billboard = null;
new THREE.TextureLoader().load("./oc.jpg", (tex) => {
  if ("colorSpace" in tex) tex.colorSpace = THREE.SRGBColorSpace;
  const aspect = (tex.image && tex.image.height && tex.image.width) ? tex.image.height / tex.image.width : 1.39;
  const w = 1.7, h = w * aspect;
  billboard = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  billboard.position.set(0, h / 2, -4);   // 糖沐站收银台前
  scene.add(billboard);
});

// ── 自动绕场:相机慢慢环视(模拟"在店里走动看" = 持续负载,用于热 soak)──
let ang = 0;
const center = new THREE.Vector3(0, 1.4, -2);

// ── HUD / 帧率 / 30fps 限帧 ──
const hud = document.getElementById("hud"), fpsbig = document.getElementById("fpsbig");
const FRAME = 1000 / 30;                    // 限 30fps
let last = performance.now(), acc = 0, frames = 0, fps = 0, hudT = 0;
const start = performance.now();
let paused = false;
document.addEventListener("visibilitychange", () => { paused = document.hidden; last = performance.now(); });

function loop(t) {
  requestAnimationFrame(loop);
  if (paused) return;
  const dt = t - last;
  if (dt < FRAME) return;                   // 限帧:不到 1/30 秒不渲染(省电/控热)
  last = t - (dt % FRAME);

  ang += 0.00018 * dt;                      // 缓慢环视
  cam.position.set(Math.cos(ang) * 5.5, 1.7, Math.sin(ang) * 5.5 - 2);
  cam.lookAt(center);
  if (billboard) billboard.quaternion.copy(cam.quaternion);   // billboard 永远面向相机

  renderer.render(scene, cam);

  frames++; acc += dt;
  if (acc >= 500) { fps = Math.round((frames * 1000) / acc); frames = 0; acc = 0; }
  if (t - hudT > 500) {
    hudT = t;
    const info = renderer.info, el = Math.floor((t - start) / 1000);
    fpsbig.textContent = fps + " fps";
    fpsbig.style.color = fps >= 28 ? "#7fd4a8" : fps >= 20 ? "#e6c84d" : "#f26d6d";
    hud.textContent =
      "soak  " + String(Math.floor(el / 60)).padStart(2, "0") + ":" + String(el % 60).padStart(2, "0") + "\n" +
      "draw calls  " + info.render.calls + "\n" +
      "triangles   " + info.render.triangles.toLocaleString() + "\n" +
      "geometries  " + info.memory.geometries + "   textures " + info.memory.textures + "\n" +
      "dpr  " + DPR + "   " + window.innerWidth + "x" + window.innerHeight;
  }
}
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
